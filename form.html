<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="a form that allows the user to choose the product, rate it and provide other details">
    <meta name="author" content="Travis Midgley">
    <title>Back to the Future Product Reviews</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <form method="get" action="review.html">
        <div>
            <label for="productName">Product Name* </label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select A Product ...</option>
            </select>
        </div>

        <fieldset class="rating-group">
            <legend>Overall Rating*</legend>
            <label for="rating1">
                <input type="radio" id="rating1" name="rating" value="1" required>☆
            </label>
            <label for="rating2">
                <input type="radio" id="rating2" name="rating" value="2" required>☆☆
            </label>
            <label for="rating3">
                <input type="radio" id="rating3" name="rating" value="3" required>☆☆☆
            </label>
            <label for="rating4">
                <input type="radio" id="rating4" name="rating" value="4" required>☆☆☆☆
            </label>
            <label for="rating5">
                <input type="radio" id="rating5" name="rating" value="5" required>☆☆☆☆☆
            </label>
        </fieldset>
        <!-- fun way to do the rating in the future
        <fieldset class="rating-group">
            <legend>Overall Rating* </legend>
            <input type="radio" id="rating5" name="rating" value="5" required>
            <label for="rating5">★</label>
            <input type="radio" id="rating4" name="rating" value="4">
            <label for="rating4">★</label>
            <input type="radio" id="rating3" name="rating" value="3">
            <label for="rating3">★</label>
            <input type="radio" id="rating2" name="rating" value="2">
            <label for="rating2">★</label>
            <input type="radio" id="rating1" name="rating" value="1">
            <label for="rating1">★</label>
        </fieldset>
    -->

        <div>
            <label for="installDate">Date of Installation* </label>
            <input type="date" id="installDate" name="installDate" required>
        </div>

        <fieldset class="features-group">
            <legend>Which features did you find useful in the product?</legend>
            <label for="durability">
                <input type="checkbox" id="durability" name="features" value="Durability">
                Durability
            </label>
            <label for="easeOfUse">
                <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                Ease of Use
            </label>
            <label for="performance">
                <input type="checkbox" id="performance" name="features" value="Performance">
                Performance
            </label>
            <label for="design">
                <input type="checkbox" id="design" name="features" value="Design">
                Design
            </label>
        </fieldset>

        <div>
            <label for="review">Written Review <span class="optional"> (optional)</span></label>
            <textarea id="review" name="review" rows="4" cols="30"></textarea>
        </div>

        <div>
            <label for="userName">Your Name <span class="optional"> (optional)</span></label>
            <input type="text" id="userName" name="userName">
        </div>

        <div>
            <input type="submit" value="Post Review">
        </div>

    </form>
    <footer>
        &copy; 2026 &bull; Travis Midgley &bull;
    </footer>
</body>

</html>
